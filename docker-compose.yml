services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports: ["8000:7860"]
    depends_on: [ollama]
volumes:
  ollama:
