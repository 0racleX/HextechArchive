# La imagen del backend ya incluye su propio Ollama con los modelos (chat + embeddings),
# por lo que no se necesita un servicio ollama aparte (el oficial viene sin modelos).
# Uso: copia backend/.env.example a backend/.env, rellénalo y ejecuta `docker compose up --build`.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["${BACKEND_PORT:-8000}:7860"]   # API en 7860 dentro del contenedor; cambia BACKEND_PORT si 8000 está reservado (Windows/Docker)

  # Frontend estático (nginx). Las VITE_* se leen del .env de la raíz (o del entorno) y se hornean en el build.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports: ["${FRONTEND_PORT:-5173}:80"]
